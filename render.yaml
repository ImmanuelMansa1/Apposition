# Render Blueprint: deploys both backend services from this repo.
# In Render: New > Blueprint > pick this repository. See DEPLOY.md.
services:
  # Python analysis API. Only the C# service calls it.
  - type: web
    name: apposition-python
    runtime: docker
    dockerContext: ./AppositionBackend/CompetitorAnalysis
    dockerfilePath: ./AppositionBackend/CompetitorAnalysis/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GEMINI_KEY
        sync: false          # Render asks for the value; it is never stored in the repo

  # C# API that the website calls.
  - type: web
    name: apposition-api
    runtime: docker
    dockerContext: ./AppositionBackend
    dockerfilePath: ./AppositionBackend/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PythonApiUrl     # internal address of the Python service
        fromService:
          type: web
          name: apposition-python
          property: hostport
      - key: AllowedOrigins   # the Vercel site URL, e.g. https://apposition.vercel.app
        sync: false
